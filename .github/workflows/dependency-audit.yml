
name: Python Dependency Security Audit

on:
  pull_request:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect dependency changes
        id: dependency_changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            pyproject.toml \
            uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Dependency changes detected."
          fi

      - name: Setup Python
        if: steps.dependency_changes.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        if: steps.dependency_changes.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Install uv
        if: steps.dependency_changes.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        if: steps.dependency_changes.outputs.changed == 'true'
        run: |
          uv sync --locked --all-extras

      - name: Export locked dependencies
        if: steps.dependency_changes.outputs.changed == 'true'
        run: |
          uv export \
            --locked \
            --all-extras \
            --no-emit-project \
            --format requirements.txt \
            --output-file requirements.txt

      - name: Run pip-audit
        if: steps.dependency_changes.outputs.changed == 'true'
        run: uv run pip-audit --strict -r requirements.txt

      - name: Generate audit report
        if: always() && steps.dependency_changes.outputs.changed == 'true'
        run: |
          pip-audit \
            --format json \
            --output pip-audit-report.json \
            -r requirements.txt || true

      - name: Upload audit report
        if: always() && steps.dependency_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Skip audit
        if: steps.dependency_changes.outputs.changed == 'false'
        run: echo "No dependency changes. pip-audit was skipped."
