
name: CI

on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff Check
        run: uv run ruff check .

      - name: Ruff Format
        run: uv run ruff format --check .

      - name: MyPy
        if: hashFiles('app/**/*.py') != ''
        run: uv run mypy app

      - name: MyPy skipped
        if: hashFiles('app/**/*.py') == ''
        run: echo "MyPy skipped: no Python files in app/"

      - name: Bandit
        run: uv run bandit -r app

  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check dependency changes
        id: changes
        run: |
          git fetch origin "${{ github.base_ref }}"
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- pyproject.toml uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.changes.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        if: steps.changes.outputs.changed == 'true'
        run: uv python install 3.12

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: uv sync --locked --all-groups

      - name: Export dependencies
        if: steps.changes.outputs.changed == 'true'
        run: uv export --locked --all-groups --no-emit-project --format requirements-txt -o requirements-audit.txt

      - name: Run pip-audit
        if: steps.changes.outputs.changed == 'true'
        run: uvx pip-audit --strict -r requirements-audit.txt

      - name: Audit skipped
        if: steps.changes.outputs.changed == 'false'
        run:
          echo "Dependency audit skipped: no dependency changes"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run unit tests
        if: hashFiles('tests/unit/test_*.py', 'tests/unit/**/*_test.py') != ''
        run: uv run pytest tests/unit -v

      - name: Unit tests skipped
        if: hashFiles('tests/unit/test_*.py', 'tests/unit/**/*_test.py') == ''
        run:
          echo "Unit tests skipped: no test files found"

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run integration tests
        if: hashFiles('tests/integration/test_*.py', 'tests/integration/**/*_test.py') != ''
        run: uv run pytest tests/integration -v --cov=app --cov-term=term-messing --cov-fail-under=80

      - name: Integration tests skipped
        if: hashFiles('tests/integration/test_*.py', 'tests/integration/**/*_test.py') == ''
        run:
          echo "Integration tests skipped: no test files found"

      - name: Run unit tests
        if: hashFiles('tests/unit/test_*.py', 'tests/unit/**/*_test.py') != ''
        run: uv run pytest tests/integration -v --cov=app --cov-term=term-messing --cov-fail-under=80

      - name: Unit tests skipped
        if: hashFiles('tests/unit/test_*.py', 'tests/unit/**/*_test.py') == ''
        run:
          echo "Integration tests skipped: no test files found"
