
name: LMS API CI

on:
  pull_request:
    branches:
      - development
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Code quality and security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked --all-extras

      - name: Ruff lint
        run: uv run ruff check app tests

      - name: Ruff format
        run: uv run ruff format --check app tests

      - name: Run mypy
        shell: bash
        run: uv run mypy app

      - name: Run Bandit
        shell: bash
        run: uv run bandit -r app -f screen -c pyproject.toml

      - name: Upload Bandit JSON report
        if: always()
        run: |
          uv run bandit -r app \
            -f json \
            -o bandit-report.json \
            -c pyproject.toml || true

      - name: Run pytest
        run: uv run pytest -v --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
          if-no-files-found: ignore
          retention-days: 30
