name: Code Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Static Analysis and Tests
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://lms:lms_test_password@localhost:5432/lms_test
      JWT_SECRET_KEY: lms_test123

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check Python lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Check types with mypy
        run: mypy src/app

      - name: Security scan with Bandit
        run: bandit -r src/app -ll

      - name: Run tests
        run: pytest -q

      - name: Audit dependencies
        run: pip-audit