[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lms-api"
version = "0.1.0"
description = "Learning Management System REST API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "pydantic-settings>=2.7,<3.0",
    "email-validator>=2.2,<3.0",
    "PyJWT>=2.10,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "python-multipart>=0.0.20,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.9,<1.0",
    "pre-commit",
    "mypy",
    "sqlalchemy[mypy]",
    "pydantic[mypy]",
    "bandit",
]
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/app"]
exclude = ["migrations/"]

strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true

plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "tests.*",
]
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # Помилки стилю pycodestyle
    "F",    # Pyflakes: невикористані імпорти, undefined names
    "W",    # Попередження pycodestyle
    "I",    # Сортування імпортів
    "UP",   # Сучасний синтаксис Python
    "B",    # Потенційні помилки bugbear
    "SIM",  # Спрощення коду
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
target = ["src/app"]
exclude_dirs = ["tests"]