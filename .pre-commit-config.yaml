exclude: |
  (?x)^(
      \.idea/.*|
      \.venv/.*|
      build/.*|
      dist/.*
  )$
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        name: Bandit - application
        args: ["-c", "pyproject.toml", "-r", "app"]
        pass_filenames: false

      - id: bandit
        name: Bandit - tests
        args: ["-c", "pyproject.toml", "-r", "tests", "-s", "S106"]
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest-cov
        name: Run pytest with coverage
        entry: uv run pytest -v
        language: system
        pass_filenames: false
        always_run: true
