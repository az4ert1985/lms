repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: Mypy type checking
        entry: mypy src/app
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: Run tests
        entry: pytest -q
        language: system
        pass_filenames: false
        always_run: true
      - id: bandit
        name: Bandit security scan
        entry: bandit -r src/app -ll
        language: system
        pass_filenames: false
        always_run: true